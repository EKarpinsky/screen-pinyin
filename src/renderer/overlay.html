<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
    <title>Screen Selection</title>
    <style>
      /* Keep overlay-specific styles - Tailwind reset handles the rest */
      html, body { width: 100%; height: 100%; overflow: hidden; background-color: transparent !important; }
      #root { width: 100%; height: 100%; background-color: transparent !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
