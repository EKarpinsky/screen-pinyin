name: Check

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install native build and capture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libx11-dev libxtst-dev libpng-dev libgtk-3-0 libnss3 libasound2 xvfb xauth x11-xserver-utils imagemagick xdotool ffmpeg fonts-wqy-zenhei
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run package
      - name: Check packaged app
        run: xvfb-run -a node scripts/smoke-package.mjs "out/ScreenPinyin Translator-linux-x64/ScreenPinyin Translator" --no-sandbox
      - name: Check screen capture
        run: xvfb-run -a -s '-screen 0 1440x900x24' node scripts/capture/demo.mjs "out/ScreenPinyin Translator-linux-x64/ScreenPinyin Translator" --no-sandbox --disable-gpu
